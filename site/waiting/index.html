function setAuto(input, value, source){

  const rank=AUTO_RANK[source]||1, prev=+(input.dataset.autoRank||0);
  if(input.value && !input.dataset.auto && input.tagName!=='SELECT') return false;
  if(input.dataset.auto && input.value!==input.dataset.autoValue) return false;
  if(input.dataset.auto && rank<prev) return false;
  input.value=value; input.dataset.auto=source; input.dataset.autoValue=value; input.dataset.autoRank=String(rank);
  input.classList.add('autofilled');

async function logAwaitingDetails(c, host){

  if(!placeholder&&open.length){alert('A replacement is already logged on this ticket.');return}
  const email=(await sb.auth.getUser()).data.user.email;

 t.scrollTop=0}

 const qb=document.querySelector('#thread .bubble.qqueued,#thread .mailcard.out');if(qb)qb.scrollIntoView({block:'center'})}
if(!window.__eggsyFilterBound){window.__eggsyFilterBound=true;document.addEventListener('click',e=>{const menu=$('filtermenu');if(!menu||menu.hidden)return;if(e.target.closest&&e.target.closest('.filterwrap'))return;filterOpen=false;menu.hidden=true});
 const fb=document.getElementById('filterbtn');if(fb)fb.addEventListener('click',e=>{e.stopPropagation();filterOpen=!filterOpen;drawChips()})}
