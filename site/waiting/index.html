<script>
const SUPABASE_URL='https://xodkbmtylftfmnxfnxxf.supabase.co';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:false,flowType:'pkce'}});
const ORIGINS={email_hey:'hey@ email',shopify_form:'Shopify form',wix_mmc_form:'MMC Wix form',tiktok_uk:'TikTok UK',tiktok_eu:'TikTok EU',tiktok_us:'TikTok US',amazon_uk:'Amazon UK',amazon_us:'Amazon US',amazon_de:'Amazon DE',amazon_fr:'Amazon FR',amazon_it:'Amazon IT',amazon_es:'Amazon ES',amazon_nl:'Amazon NL',amazon_se:'Amazon SE',amazon_pl:'Amazon PL',amazon_be:'Amazon BE',amazon_other:'Amazon (other)',walmart:'Walmart',facebook:'Facebook',instagram:'Instagram'};
const GROUPS=[['all','All',()=>true],['email','Email (hey@)',o=>o==='email_hey'],['forms','Web forms',o=>o==='shopify_form'||o==='wix_mmc_form'],['amazon','Amazon',o=>o.startsWith('amazon')],['tiktok','TikTok',o=>o.startsWith('tiktok')],['walmart','Walmart',o=>o==='walmart'],['meta','Facebook & Instagram',o=>o==='facebook'||o==='instagram']];
// Second-level filters per channel: [origin, short label, show even when empty]
const SUBS={amazon:[['amazon_uk','UK',1],['amazon_us','US',1],['amazon_de','DE',1],['amazon_nl','NL',1],['amazon_se','SE',1],['amazon_fr','FR'],['amazon_it','IT'],['amazon_es','ES'],['amazon_pl','PL'],['amazon_be','BE'],['amazon_other','Other']],
 tiktok:[['tiktok_uk','UK',1],['tiktok_us','US',1],['tiktok_eu','EU',1]],

 meta:[['instagram','Instagram',1],['facebook','Facebook',1]]};

let convs=[],grp='all',sub='',dft='',draftMap={},sel=null,qmap={},langMap={},emailCh={},stMap={};

const MODES={inbox:{title:'Inbox',path:'/inbox/',intro:'Conversations that need a reply from us: the customer wrote last and it isn’t resolved. Oldest first, so the longest wait is at the top.',empty:'Nothing needs a reply right now. 🎉',statuses:['open','awaiting_approval','awaiting_customer']},
 waiting:{title:'Waiting',path:'/waiting/',intro:'We’ve replied, or a reply is queued, sending or sent, and we’re waiting on the customer. A new customer message moves the conversation back to the Inbox.',empty:'No conversations are waiting on a customer.',statuses:['open','awaiting_approval','awaiting_customer']},
 resolved:{title:'Resolved',path:'/resolved/',intro:'Resolved conversations (and ignored spam or affiliate messages). A new customer message on a resolved conversation moves it back to the Inbox.',empty:'No resolved conversations yet.',statuses:['resolved','ignored']}};

(function(){const m=MODES[MODE];document.getElementById('ptitle').textContent=m.title;document.getElementById('atitle').textContent=m.title;document.getElementById('pintro').textContent=m.intro;
 })();

 if(error){console.warn('state',error.message);return}stMap={};(data||[]).forEach(r=>{stMap[r.conversation_id]=r})}
async function refreshStates(){await loadStates();drawChips();drawList();EggsyNav.refreshCounts()}

const LNAME={german:'de',dutch:'nl',italian:'it',swedish:'sv',spanish:'es',french:'fr',english:'en'};

const langName=l=>{const i=isoOf(l);return i?(LANGS[i]||i.toUpperCase()):''};
const TRK='eggsy-translate';

let started=false;
function render(session){
 const email=session&&session.user&&session.user.email;
 if(!email){$('auth').style.display='block';$('app').style.display='none';$('who').innerHTML='';EggsyNav.setUser(null);started=false;return}
 $('who').innerHTML='';
 if(!okEmail(email)){$('auth').style.display='block';$('app').style.display='none';EggsyNav.setUser(null);started=false;EggsyAuth.reject(sb,email,setMsg);return}
 $('auth').style.display='none';$('app').style.display='block';
 EggsyNav.setUser(email,()=>sb.auth.signOut(),sb);
 const ret=EggsyNav.takeReturn();
 if(ret&&ret.startsWith('/sent/')){location.replace(ret);return}
 if(ret&&!/^\/(inbox|waiting|resolved)\//.test(ret)&&ret!=='/'){location.replace(ret);return}
 if(ret&&ret.indexOf('?c=')>0&&!new URLSearchParams(location.search).get('c')){
  if(ret.split('?')[0]===location.pathname)history.replaceState(null,'',ret);else{location.replace(ret);return}}
 if(history.replaceState&&location.hash.includes('access_token'))history.replaceState(null,'',location.pathname+location.search);

async function load(){

// Deep link: /inbox/?c=<conversation_id>

// Eggsy's current draft per conversation (cx_draft_readiness): "gaps" when it still has [ ] notes, or promises a
// replacement, refund or return that isn't logged yet (the same check that blocks Send); otherwise "ready".
async function loadDrafts(){const m={};
 const {data}=await sb.rpc('cx_draft_readiness');
 (data||[]).forEach(r=>{const acts=(r.missing_actions||[]).map(t=>t==='any'?'action':t);m[r.conversation_id]={notes:r.notes||0,acts,gaps:(r.notes||0)>0||acts.length>0,at:r.drafted_at}});draftMap=m}
function draftState(c){const d=draftMap[c.id];if(!d||qmap[c.id])return 'none';return d.gaps?'gaps':'ready'}
async function loadEmailCh(){emailCh={};const {data}=await sb.from('email_send_channels').select('origin,enabled');(data||[]).forEach(r=>{if(r.enabled)emailCh[r.origin]=true})}
async function loadLangs(){const m={};
 const {data}=await sb.from('messages').select('conversation_id,language').neq('language','en').not('language','is',null).limit(5000);

async function loadQueueSummary(){qmap={};
 const {data}=await sb.from('reply_queue').select('conversation_id,status').in('status',['queued','sending','failed']);

function readFilterUrl(){const u=new URLSearchParams(location.search);const g=u.get('ch')||'all';grp=GROUPS.some(x=>x[0]===g)?g:'all';

 const qs=u.toString();history.replaceState(history.state,'',location.pathname+(qs?'?'+qs:''))}

 keepOnVisible(box);drawDraftChips();const sbx=$('subchips');sbx.innerHTML='';const list=SUBS[grp];if(!list)return;
 const g=GROUPS.find(x=>x[0]===grp);const tot=mc.filter(c=>g[2](c.origin)).length;
 const all=el('button','chip'+(!sub?' on':''),'All '+(grp==='meta'?'Meta':g[1]));all.type='button';all.append(el('small',null,tot));all.onclick=()=>setFilter(grp,'');sbx.append(all);

 // outbound

function whoLine(m,k,o){const a=m.author||'';o=o||'';

 if(k==='draft')return ['✏️ '+(a||'Eggsy'),'Draft, not sent'];

    if(error){m.setErr(error.message,true);return}

      ?('Amazon MCF replacement placed for a whole game. Original order ID '+details.original_order_id+'. MCF order ID '+details.mcf_order_id+'. '+details.marketplace+' · '+(details.plain_packaging?'plain packaging':'Amazon packaging')+' · '+details.shipping_speed+'.')
      :('Amazon MCF replacement prepared for a whole game. Original order ID '+details.original_order_id+'. Copy the fields into Seller Central, then record the MCF order ID. The reply cannot be queued until it is marked placed.');
    await logNote(c,note,'note:action:'+data.id);
    closeActModal();await reloadActions(c,host);
  }
  const saveBtn=el('button','btn ghost','Save details');saveBtn.type='button';saveBtn.onclick=()=>save(false);
  const placed=el('button','btn','Mark MCF order placed');placed.type='button';placed.onclick=()=>save(true);
  const cancel=el('button','btn ghost','Cancel');cancel.type='button';cancel.onclick=closeActModal;
  m.bar.append(saveBtn,placed,cancel);
}
async function openPartReplacementModal(c, host){
  const m=actModal('Send a replacement part');
  m.body.append(el('p','hint','This is for replacement PARTS only. It creates a free Shopify order tagged eggsy-replacement so it goes to the same 3PL as website orders. Whole games should use Amazon MCF instead. Nothing is sent to the customer until you queue a reply.'));
  const itemsBox=el('div');const selected=[];
  const search=field('Search products or parts',{placeholder:'Name or SKU'});
  const results=el('div','actresults');results.style.display='none';
  const chosen=el('div');
  function drawChosen(){chosen.innerHTML='';selected.forEach((it,idx)=>{const row=el('div','actrow');row.append(document.createTextNode(it.label+' × '));
    const q=el('input');q.type='number';q.min='1';q.value=String(it.quantity||1);q.style.width='64px';q.onchange=()=>{it.quantity=Math.max(1,+q.value||1)};
    const rm=el('button','btn ghost','Remove');rm.type='button';rm.onclick=()=>{selected.splice(idx,1);drawChosen()};
    row.append(q,rm);chosen.append(row)})}
  let tmr;search.i.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{const q=search.i.value.trim();if(q.length<2){results.style.display='none';return}
    results.style.display='';results.textContent='Searching…';
    const r=await callCx({action:'search_products',q});
    results.innerHTML='';
    if(r.error==='not_configured'||r.ok===false&&!r.products){results.append(el('div','hint','Shopify is not connected to Eggsy CX yet, so products can’t be searched here. Create the £0 order in Shopify Admin, then record its number.'));return}
    const prods=r.products||[];if(!prods.length){results.append(el('div','hint','No matching products.'));return}
    prods.forEach(p=>{(p.variants||[]).forEach(v=>{const b=el('button');b.type='button';b.textContent=v.label+(v.price?' · £'+v.price:'');
      b.onclick=()=>{selected.push({variantId:v.id,title:p.title+(v.title&&v.title!=='Default Title'?' · '+v.title:''),sku:v.sku,price:v.price,quantity:1,label:v.label});drawChosen();results.style.display='none'};results.append(b)})})},250)};
  itemsBox.append(search.w,results,chosen);m.body.append(itemsBox);
  const orig=el('div');m.body.append(orig);
  const af={};
  [['firstName','First name'],['lastName','Last name'],['address1','Address line 1'],['address2','Address line 2'],['city','City'],['province','County / state'],['zip','Postcode'],['countryCode','Country code (GB, US…)'],['phone','Phone']].forEach(([k,lab])=>{const f=field(lab,{value:k==='countryCode'?'GB':''});af[k]=f.i;m.body.append(f.w)});
  const reason=field('Reason',{tag:'textarea',minHeight:'64px'});m.body.append(reason.w);
  const rec=field('Or record an order already created in Shopify',{placeholder:'#11312'});m.body.append(rec.w);
  m.setErr('Loading the original order, if we can find it…');
  const looked=await callCx({action:'lookup_order',conversation_id:c.id});
  if(looked.order&&looked.order.shippingAddress){
    const a=looked.order.shippingAddress;
    af.firstName.value=a.firstName||'';af.lastName.value=a.lastName||'';af.address1.value=a.address1||'';af.address2.value=a.address2||'';
    af.city.value=a.city||'';af.province.value=a.province||a.provinceCode||'';af.zip.value=a.zip||'';
    af.countryCode.value=a.countryCodeV2||a.country||'GB';af.phone.value=a.phone||'';
    const quick=el('div');quick.append(el('div','hint','Items on Shopify '+looked.order.name+' — click to add:'));
    (looked.order.lineItems&&looked.order.lineItems.nodes||[]).forEach(li=>{const b=el('button','btn ghost',li.title+' × '+li.quantity);b.type='button';
      b.onclick=()=>{selected.push({variantId:li.variant&&li.variant.id,title:li.title,sku:li.sku,price:li.originalUnitPriceSet&&li.originalUnitPriceSet.shopMoney&&li.originalUnitPriceSet.shopMoney.amount,quantity:li.quantity||1,label:li.title});drawChosen()};quick.append(b)});
    orig.append(quick);
    m.setErr('Address filled from '+looked.order.name+'. Check it before creating the order.');
  }else if(looked.error==='not_configured'){m.setErr('Shopify is not connected to Eggsy CX yet. You can still fill this in and record a Shopify order number after you create it in Admin.')}
  else m.setErr(looked.order? '':'No Shopify order was found for this ticket — fill in the address and items.');
  const preview=el('button','btn ghost','Preview (no order created)');preview.type='button';
  const go=el('button','btn','Create free replacement');go.type='button';
  const cancel=el('button','btn ghost','Cancel');cancel.type='button';cancel.onclick=closeActModal;
  m.bar.append(preview,go,cancel);
  function collect(){
    const address={};Object.keys(af).forEach(k=>address[k]=af[k].value.trim());
    return {conversation_id:c.id,items:selected,address,reason:reason.i.value.trim()};
  }
  preview.onclick=async()=>{m.setErr('Checking…');const r=await callCx(Object.assign({action:'replacement',dry_run:true},collect()));
    if(!r.ok){m.setErr(r.error||r.message||'Could not preview',true);return}
    m.setErr('Dry run only — no Shopify order was created. Tags: '+(r.would_create&&r.would_create.tags||[]).join(', ')+(r.shopify_connected?' Shopify is connected.':' Shopify API is not connected, so Create will ask you to record an Admin order instead.'))};
  go.onclick=async()=>{
    if(rec.i.value.trim()){
      if(!selected.length&&!reason.i.value.trim()){m.setErr('Add what you sent, or a reason, so the ticket has a record.',true);return}
      const address={};Object.keys(af).forEach(k=>address[k]=af[k].value.trim());
      const {data,error}=await sb.from('cx_actions').insert({conversation_id:c.id,type:'replacement',status:'created',shopify_order_name:rec.i.value.trim(),details:{kind:'part',fulfilment:'shopify_3pl',items:selected,address,reason:reason.i.value.trim(),recorded_manually:true,source_origin:c.origin,source_order:c.order_number},created_by:(await sb.auth.getUser()).data.user.email}).select('id').single();
      if(error){m.setErr(error.message,true);return}
      await logNote(c,'Replacement recorded against Shopify order '+rec.i.value.trim()+(selected.length?' for '+selected.map(i=>i.title+' × '+(i.quantity||1)).join(', '):'')+'.','note:action:'+data.id);
      closeActModal();await reloadActions(c,host);return;
    }
    if(!selected.length){m.setErr('Pick at least one product or part.',true);return}
    if(!confirm('Create a real £0 Shopify order that will go to the 3PL like any other website order?'))return;
    go.disabled=true;m.setErr('Creating Shopify order…');
    const r=await callCx(Object.assign({action:'replacement',create:true,dry_run:false},collect()));
    if(!r.ok){
      go.disabled=false;
      if(r.error==='not_configured'){m.setErr((r.message||'Shopify is not connected.')+' You can create the order in Shopify Admin using tags '+(r.would_create&&r.would_create.tags||[]).join(', ')+' and then paste the order number above.',true);return}
      m.setErr(r.error||'Could not create the order',true);return;
    }
    if(r.routing_warning) alert(r.routing_warning);
    closeActModal();await reloadActions(c,host);
  };
}
async function openRefundModal(c, host){
  const m=actModal('Refund');
  const marketplace=sellerRefundUrl(c.origin,c.order_number);
  const looked=await callCx({action:'lookup_order',conversation_id:c.id});
  const shopifyOrder=looked&&looked.order;
  if(shopifyOrder){
    m.body.append(el('p','hint','Shopify order '+shopifyOrder.name+' · '+shopifyOrder.displayFinancialStatus+' · total '+((shopifyOrder.currentTotalPriceSet&&shopifyOrder.currentTotalPriceSet.shopMoney&&(shopifyOrder.currentTotalPriceSet.shopMoney.currencyCode+' '+shopifyOrder.currentTotalPriceSet.shopMoney.amount))||'')));
    const amt=field('Amount',{value:(shopifyOrder.currentTotalPriceSet&&shopifyOrder.currentTotalPriceSet.shopMoney&&shopifyOrder.currentTotalPriceSet.shopMoney.amount)||''});
    const restockL=el('label','req');const restock=el('input');restock.type='checkbox';restockL.append(restock,document.createTextNode(' Restock items'));
    const notifyL=el('label','req');const notify=el('input');notify.type='checkbox';notify.checked=true;notifyL.append(notify,document.createTextNode(' Email the customer from Shopify'));
    const reason=field('Reason',{tag:'textarea'});
    m.body.append(amt.w,restockL,notifyL,reason.w);
    const preview=el('button','btn ghost','Preview (no refund)');preview.type='button';
    const go=el('button','btn','Refund in Shopify');go.type='button';
    preview.onclick=async()=>{const r=await callCx({action:'refund',dry_run:true,conversation_id:c.id,shopify_order_id:shopifyOrder.id,amount:amt.i.value.trim(),restock:restock.checked,notify:notify.checked,reason:reason.i.value.trim()});
      m.setErr(r.ok?('Dry run only — would refund '+((r.would_refund&&r.would_refund.amount)||amt.i.value)+' '+(r.would_refund&&r.would_refund.currency||'')+' on '+shopifyOrder.name):(r.error||r.message||'Could not preview'),!r.ok)};
    go.onclick=async()=>{if(!confirm('This will create a real Shopify refund of '+amt.i.value+' on '+shopifyOrder.name+'. Continue?'))return;
      go.disabled=true;const r=await callCx({action:'refund',create:true,dry_run:false,confirm:true,conversation_id:c.id,shopify_order_id:shopifyOrder.id,amount:amt.i.value.trim(),restock:restock.checked,notify:notify.checked,reason:reason.i.value.trim()});
      if(!r.ok){go.disabled=false;m.setErr(r.error==='not_configured'?(r.message||'Shopify is not connected.'):(r.error||'Refund failed'),true);return}
      closeActModal();await reloadActions(c,host)};
    m.bar.append(preview,go);
  }else{
    m.body.append(el('p','hint',marketplace?'No Shopify order is linked, so this is logged as a manual refund. Open Seller Center, process it there, then mark it done.':'No Shopify order was found. Record the refund you process elsewhere, then mark it done.'));
  }
  if(marketplace||!shopifyOrder){
    const url=marketplace||'';
    if(url){const a=el('a','btn ghost','Open Seller Center');a.href=url;a.target='_blank';m.body.append(a)}
    const amt=field('Amount (optional)',{placeholder:'e.g. 19.99'});
    const reason=field('Reason',{tag:'textarea'});
    m.body.append(amt.w,reason.w);
    const save=el('button','btn',shopifyOrder?'Also log a manual refund':'Log refund task');save.type='button';
    save.onclick=async()=>{
      const details={manual:true,seller_center_url:url||null,amount:amt.i.value.trim()||null,amount_currency:'',reason:reason.i.value.trim(),source_origin:c.origin,source_order:c.order_number};
      const {data,error}=await sb.from('cx_actions').insert({conversation_id:c.id,type:'refund',status:'created',details,created_by:(await sb.auth.getUser()).data.user.email}).select('id').single();
      if(error){m.setErr(error.message,true);return}
      await logNote(c,'Manual refund task logged'+(details.amount?' for '+details.amount:'')+(url?' · process it in Seller Center':'')+'.','note:action:'+data.id);
      closeActModal();await reloadActions(c,host);
    };
    m.bar.append(save);
  }
  const cancel=el('button','btn ghost','Cancel');cancel.type='button';cancel.onclick=closeActModal;m.bar.append(cancel);
}
async function openReturnModal(c, host){
  const m=actModal('Record a return');
  m.body.append(el('p','hint','This logs the expected return and adds the return address to your draft reply. The documented website return address is The Finishing Line in Basildon. Edit it if this customer should send the parcel somewhere else.'));
  const items=field('What is coming back',{tag:'textarea',value:'',minHeight:'56px'});
  const reason=field('Reason',{tag:'textarea',minHeight:'56px'});
  const outcome=el('select');[['refund','Refund once it arrives'],['replacement','Replacement once it arrives']].forEach(([v,l])=>{const o=el('option',null,l);o.value=v;outcome.append(o)});
  const ow=el('div');ow.append(el('label',null,'When it arrives'),outcome);
  const instr=field('Instructions to add to the reply',{tag:'textarea',minHeight:'160px'});
  instr.i.value=returnInstructions('refund');
  outcome.onchange=()=>{const cur=returnInstructions(outcome.value==='replacement'?'replacement':'refund');if(!instr.i.dataset.edited||instr.i.value===instr.i.dataset.prev){instr.i.value=cur}instr.i.dataset.prev=cur};
  instr.i.dataset.prev=instr.i.value;instr.i.oninput=()=>{instr.i.dataset.edited='1'};
  m.body.append(items.w,reason.w,ow,instr.w);
  const go=el('button','btn','Save and add to reply');go.type='button';
  go.onclick=async()=>{
    const details={items:items.i.value.trim(),reason:reason.i.value.trim(),outcome:outcome.value,instructions:instr.i.value.trim(),source_origin:c.origin,source_order:c.order_number,return_address:UK_RETURN_ADDR};
    const {data,error}=await sb.from('cx_actions').insert({conversation_id:c.id,type:'return',status:'expected',details,created_by:(await sb.auth.getUser()).data.user.email}).select('id').single();
    if(error){m.setErr(error.message,true);return}
    await logNote(c,'Return expected'+(details.items?': '+details.items:'')+'. Outcome on arrival: '+details.outcome+'.','note:action:'+data.id);
    insertIntoComposer(details.instructions);
    closeActModal();await reloadActions(c,host);
  };
  const cancel=el('button','btn ghost','Cancel');cancel.type='button';cancel.onclick=closeActModal;
  m.bar.append(go,cancel);
}

// Instant channels: re-check for a few seconds so the Sent / Failed badge appears without reloading.
async function watchSend(id){for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,2500));if(sel!==id)return;
 const {data}=await sb.from('reply_queue').select('status,email_note').eq('conversation_id',id).in('status',['queued','sending']);
 if(!data||!data.length||data.every(r=>r.status==='queued'&&r.email_note)){await refreshAfterQueue(id);return}}}
// If an opened conversation belongs to another view (e.g. an old /inbox/?c= link), say where it lives now.
function showElsewhere(c){const box=document.getElementById('elsewhere');if(!box)return;box.innerHTML='';box.className='';const b=bucketOf(c);if(b===MODE)return;
 box.className='elsewhere';box.append(el('span',null,'This conversation is in '+MODES[b].title+'.'));const a=el('a',null,'Open it in '+MODES[b].title+' →');a.href=MODES[b].path+'?c='+c.id;box.append(a)}
// Published knowledge-base articles for this channel (same list Eggsy's drafts use: kb_for_origin).
async function kbFor(c,t){const d=el('details','kbbox elog');d.append(el('summary',null,'📚 Knowledge for '+(ORIGINS[c.origin]||c.origin)));t.insertBefore(d,document.querySelector('#thread .hist-h'));
 d.ontoggle=async()=>{if(!d.open||d.dataset.done)return;d.dataset.done='1';const ul=el('ul');d.append(ul);ul.append(el('li',null,'Loading…'));
  const {data,error}=await sb.rpc('kb_for_origin',{p_origin:c.origin});ul.innerHTML='';
  if(error){ul.append(el('li',null,'Could not load: '+error.message));return}
  if(!data||!data.length){ul.append(el('li',null,'No published articles yet.'));return}
  data.forEach(a=>{const li=el('li');const l=el('a',null,a.title);l.href='/knowledge/?a='+a.id;l.target='_blank';li.append(l,el('small',null,' · '+a.category+(a.channel_specific?' · this channel':'')+(a.language!=='en'?' · '+a.language.toUpperCase():'')));ul.append(li)})}}
async function refreshAfterQueue(id){await Promise.all([loadQueueSummary(),loadDrafts()]);await loadStates();EggsyNav.refreshCounts();drawChips();drawList();if(sel!==id)return;await openConv(id,false);
 const qb=[...document.querySelectorAll('#thread .bubble.q-queued,#thread .bubble.qqueued')].pop();if(qb)qb.scrollIntoView({block:'center'})}
window.onpopstate=()=>{readFilterUrl();drawChips();const id=new URLSearchParams(location.search).get('c');if(id&&convs.find(c=>c.id===id))openConv(id,false);else{sel=null;document.body.classList.remove('showthread');drawList()}};
</script>
